# ==============================================================================
# FILTRO DE FAIL2BAN PARA JELLYFIN (ONLYUSES)
# ==============================================================================
# Copiar este archivo a /etc/fail2ban/filter.d/jellyfin.conf
# ==============================================================================

[Definition]
# Detecta intentos fallidos de autenticación en los logs de Jellyfin
failregex = ^.*Authentication request for ".*" has been denied \(IP: "<HOST>"\)\..*$
ignoreregex =
