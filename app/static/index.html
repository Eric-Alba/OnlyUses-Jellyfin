<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONLYUSES - Registro</title>
    <style>
        body {
            background-color: #000;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-image: url('https://raw.githubusercontent.com/Eric-Alba/OnlyUses-Jellyfin/main/Manuales/img/fondo.jpg'); /* Opcional: tu fondo */
            background-size: cover;
        }
        .container {
            background-color: rgba(20, 20, 20, 0.95);
            padding: 40px;
            border-radius: 10px;
            border: 1px solid #ff0000;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.2);
            width: 350px;
            text-align: center;
        }
        h1 { color: #ff0000; margin-bottom: 5px; text-transform: uppercase; }
        p.subtitle { color: #ccc; margin-bottom: 25px; font-size: 0.9em; }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: #222;
            border: 1px solid #444;
            border-radius: 5px;
            color: white;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #ff0000;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }
        button:hover { background-color: #cc0000; transform: scale(1.02); }
        
        /* Estilo mejorado para el retorno */
        .footer-link {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #333;
        }
        .footer-link p {
            color: #888;
            font-size: 0.85em;
            margin-bottom: 8px;
        }
        .footer-link a {
            color: #ff0000;
            text-decoration: none;
            font-size: 0.85em;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .footer-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ONLYUSES</h1>
        <p class="subtitle">Registro de Usuario</p>
        
        <form action="/register" method="post">
            <input type="text" name="username" placeholder="Usuario" required>
            <input type="password" name="password" placeholder="Contraseña" required>
            <input type="email" name="email" placeholder="Email (Opcional)">
            <button type="submit">CREAR CUENTA</button>
        </form>

        <div class="footer-link">
            <p>¿Ya tienes una cuenta?</p>
            <a href="http://10.1.100.11:8096">← Volver al inicio de sesión</a>
        </div>
    </div>
</body>
</html>
